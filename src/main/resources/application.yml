spring:
  config:
    import: optional:file:.env
  application:
    name: homestay-backend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=HomestayManagement;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: sa
    password: 123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        default_batch_fetch_size: 20

  # Cấu hình upload file
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB


  # Cấu hình gửi email
  mail:
    host: smtp.gmail.com
    port: 587
    # Fallback để app không crash khi thiếu .env (email sẽ không gửi được)
    username: ${MAIL_USERNAME:no-reply@dev.local}
    password: ${MAIL_PASSWORD:dev-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT config — fallback secret chỉ dùng trong dev, BẮT BUỘC override bằng .env trong production
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-default-secret-change-in-production-must-be-long}
    expiration-ms: 900000        # 15 phút
    refresh-expiration-days: 30  # 30 ngày

  # Google OAuth2 - dùng để verify ID Token gửi từ frontend
  google:
    client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}

  # Thư mục lưu file upload
  upload:
    dir: uploads/

  # Tự động thêm dữ liệu demo khi khởi động (dev)
  seed:
    enabled: true

vnpay:
  tmnCode: ${VNPAY_TMN_CODE:YQ23CU6W}
  hashSecret: ${VNPAY_HASH_SECRET:PSSN8ARRWUX199ZDTDY4Z6UTK1GCDOZB}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
